name: Build desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build macOS
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: flutter build macos --release

      - name: Build Windows
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: flutter build windows --release

      - name: Create Windows MSIX certificate
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString -String "pulse-local-cert" -Force -AsPlainText
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Pulse" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Pulse MSIX" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $release = "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release"
          Export-PfxCertificate -Cert $cert -FilePath "$release\pulse-signing.pfx" -Password $password
          Export-Certificate -Cert $cert -FilePath "$release\Pulse.cer"

      - name: Build Windows MSIX
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release"
          dart run msix:create `
            --install-certificate false `
            --certificate-path "$release\pulse-signing.pfx" `
            --certificate-password "pulse-local-cert"

      - name: Package macOS app
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Pulse.app pulse-macos.zip

      - name: Package Windows app
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pulse-windows.zip

      - name: Upload macOS app
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: pulse-macos
          path: pulse-macos.zip

      - name: Upload Windows app
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pulse-windows
          path: |
            pulse-windows.zip
            build/windows/x64/runner/Release/*.msix
            build/windows/x64/runner/Release/*.cer
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
