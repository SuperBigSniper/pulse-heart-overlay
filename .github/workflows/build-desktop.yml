name: Build desktop

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test-output.txt
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo '### flutter test failures (tail of output)'
              echo '```'
              tail -n 200 test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi

      - name: Publish test log to ci-log branch on failure
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git fetch origin ci-log || true
          if git rev-parse --verify origin/ci-log >/dev/null 2>&1; then
            git checkout --force -B ci-log origin/ci-log
          else
            git checkout --force --orphan ci-log
            git reset --hard
          fi
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f test-output.txt
          git commit -m "windows flutter test log (run ${{ github.run_number }}, ${{ github.sha }})"
          git push --force origin ci-log

      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Pulse.app pulse-macos.zip

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pulse-windows.zip

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: pulse-macos
          path: pulse-macos.zip

      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pulse-windows
          path: pulse-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
